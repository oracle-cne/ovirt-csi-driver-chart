csiController:
  csiAttacher:
    containerSecurityContext:
      privileged: true
    image:
      repository: olcne/csi-attacher
      tag: v4.12.0
    resources:
      limits:
        cpu: 160m
        memory: 128Mi
      requests:
        cpu: 80m
        memory: 64Mi
  csiProvisioner:
    containerSecurityContext:
      privileged: true
    image:
      repository: olcne/csi-provisioner
      tag: v6.3.0
    resources:
      limits:
        cpu: 160m
        memory: 128Mi
      requests:
        cpu: 80m
        memory: 64Mi
  csiResizer:
    containerSecurityContext:
      privileged: true
    image:
      repository: olcne/csi-resizer
      tag: v2.2.0
    resources:
      limits:
        cpu: 160m
        memory: 128Mi
      requests:
        cpu: 80m
        memory: 64Mi
  livenessProbe:
    image:
      repository: olcne/livenessprobe
      tag: v2.19.0
    resources:
      limits:
        cpu: 160m
        memory: 128Mi
      requests:
        cpu: 80m
        memory: 64Mi
  ovirtController:
    name: ovirt-csi-controller-plugin
    containerSecurityContext:
      privileged: true
    env:
      csiEndpoint: unix:///csi-socket/csi.sock
      ovirtConfig: /tmp/config/ovirt-config.yaml
    image:
      repository: olcne/ovirt-csi-driver
      tag: v4.21.1
    imagePullPolicy: Always
    # Overrides for the global probes configuration.
    readinessProbe: {}
    livenessProbe: {}
    resources:
      limits:
        cpu: 160m
        memory: 128Mi
      requests:
        cpu: 80m
        memory: 64Mi
  prepareOvirtConfig:
    env:
      ovirtCafile: /tmp/config/ovirt-engine-ca.pem
    image:
      repository: olcne/ovirt-csi-driver
      tag: v4.21.1
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 160m
        memory: 128Mi
  replicas: 1
csiNode:
  csiDriverRegistrar:
    image:
      repository: olcne/csi-node-driver-registrar
      tag: v2.17.0
    resources:
      limits:
        cpu: 160m
        memory: 128Mi
      requests:
        cpu: 80m
        memory: 64Mi
  livenessProbe:
    image:
      repository: olcne/livenessprobe
      tag: v2.19.0
    resources:
      limits:
        cpu: 160m
        memory: 128Mi
      requests:
        cpu: 80m
        memory: 64Mi
  ovirtNode:
    name: ovirt-csi-node-plugin
    containerSecurityContext:
      privileged: true
    env:
      csiEndpoint: unix:///csi-socket/csi.sock
      ovirtConfig: /tmp/config/ovirt-config.yaml
    image:
      repository: olcne/ovirt-csi-driver
      tag: v4.21.1
    imagePullPolicy: Always
    # Overrides for the global probes configuration.
    readinessProbe: {}
    livenessProbe: {}
    resources:
      limits:
        cpu: 160m
        memory: 128Mi
      requests:
        cpu: 80m
        memory: 64Mi
  prepareOvirtConfig:
    env:
      ovirtCafile: /tmp/config/ovirt-engine-ca.pem
    image:
      repository: olcne/ovirt-csi-driver
      tag: v4.21.1
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
probes:
  readinessProbe:
    enabled: false
    httpGet:
      path: /healthz
      port: healthz
    periodSeconds: 2
    timeoutSeconds: 3
  livenessProbe:
    enabled: true
    failureThreshold: 5
    # The template selects /livez:9808 when readiness is enabled, otherwise
    # /healthz on the healthz port, unless httpGet.path or httpGet.port is
    # explicitly set here or in a component override.
    httpGet: {}
    initialDelaySeconds: 10
    periodSeconds: 2
    timeoutSeconds: 3
kubernetesClusterDomain: cluster.local
ovirt:
  caProvided: true
  insecure: false
  secretName: ovirt-csi-creds
  caConfigMapName: ovirt-csi-ca.crt
ovirtCsiDriverControllerSa:
  serviceAccount:
    annotations: {}
ovirtCsiDriverNodeSa:
  serviceAccount:
    annotations: {}
pvc:
  1GOvirtCowDisk:
    storageClass: ovirt-csi-sc
    storageRequest: 1Gi

driver:
  name: csi.ovirt.org

## Ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

# Run with helm test; uses the PVC storage class and size configured above.
tests:
  image:
    repository: container-registry.oracle.com/os/oraclelinux
    tag: 8-slim
    pullPolicy: IfNotPresent
