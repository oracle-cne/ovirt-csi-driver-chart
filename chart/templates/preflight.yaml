{{- if .Values.preflight.enabled }}
{{- $preflightName := printf "%s-preflight" (include "mychart.fullname" . | trunc 53 | trimSuffix "-") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $preflightName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $preflightName }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $preflightName }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $preflightName }}
subjects:
- kind: ServiceAccount
  name: {{ $preflightName }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $preflightName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mychart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.preflight.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "mychart.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $preflightName }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
      - name: csi-attacher
        image: {{ .Values.csiController.csiAttacher.image.repository }}:{{ .Values.csiController.csiAttacher.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: Always
        args: ["--version"]
      - name: csi-provisioner
        image: {{ .Values.csiController.csiProvisioner.image.repository }}:{{ .Values.csiController.csiProvisioner.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: Always
        args: ["--version"]
      - name: csi-resizer
        image: {{ .Values.csiController.csiResizer.image.repository }}:{{ .Values.csiController.csiResizer.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: Always
        args: ["--version"]
      - name: controller-liveness-probe
        image: {{ .Values.csiController.livenessProbe.image.repository }}:{{ .Values.csiController.livenessProbe.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: Always
        args: ["--help"]
      - name: node-liveness-probe
        image: {{ .Values.csiNode.livenessProbe.image.repository }}:{{ .Values.csiNode.livenessProbe.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: Always
        args: ["--help"]
      - name: node-driver-registrar
        image: {{ .Values.csiNode.csiDriverRegistrar.image.repository }}:{{ .Values.csiNode.csiDriverRegistrar.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: Always
        args: ["--version"]
      - name: prepare-controller-ovirt-config
        image: {{ .Values.csiController.prepareOvirtConfig.image.repository }}:{{ .Values.csiController.prepareOvirtConfig.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: Always
        command: ["/bin/sh", "-ec"]
        args:
        - >-
          /ovirt-csi-driver --prepare-ovirt-config
          --prepare-ovirt-config-file={{ .Values.csiController.ovirtController.env.ovirtConfig }}
          --prepare-ovirt-config-ca-file={{ .Values.csiController.prepareOvirtConfig.env.ovirtCafile }}
          --prepare-ovirt-config-insecure={{ .Values.ovirt.insecure }} >/dev/null 2>&1
        terminationMessagePolicy: File
        env:
        - name: OVIRT_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.ovirt.secretName }}
              key: ovirt_url
        - name: OVIRT_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.ovirt.secretName }}
              key: ovirt_username
        - name: OVIRT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.ovirt.secretName }}
              key: ovirt_password
        {{- if .Values.ovirt.caProvided }}
        - name: OVIRT_CAFILE
          value: {{ quote .Values.csiController.prepareOvirtConfig.env.ovirtCafile }}
        - name: OVIRT_CA_BUNDLE
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.ovirt.caConfigMapName }}
              key: ca.crt
        {{- end }}
        volumeMounts:
        - name: controller-config
          mountPath: /tmp/config
      - name: validate-controller-ovirt-config
        image: {{ .Values.csiController.ovirtController.image.repository }}:{{ .Values.csiController.ovirtController.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: Always
        command: ["/bin/sh", "-ec"]
        args:
        - |
          echo 'Starting controller oVirt connection validation.'
          /ovirt-csi-driver --endpoint=unix:///csi-socket/csi.sock >/dev/null 2>&1 &
          driver_pid=$!
          for _ in $(seq 1 {{ .Values.preflight.ovirtConnectionTimeoutSeconds }}); do
            if [ -S /csi-socket/csi.sock ]; then
              kill -KILL "$driver_pid" 2>/dev/null || true
              echo 'Controller oVirt connection validation succeeded.'
              exit 0
            fi
            if ! kill -0 "$driver_pid" 2>/dev/null; then
              echo 'Controller oVirt connection validation failed.' >&2
              exit 1
            fi
            sleep 1
          done
          kill -KILL "$driver_pid" 2>/dev/null || true
          echo 'Controller oVirt connection validation timed out.' >&2
          exit 1
        terminationMessagePolicy: File
        env:
        - name: OVIRT_CONFIG
          value: {{ quote .Values.csiController.ovirtController.env.ovirtConfig }}
        volumeMounts:
        - name: controller-config
          mountPath: /tmp/config
        - name: controller-socket
          mountPath: /csi-socket
      - name: prepare-node-ovirt-config
        image: {{ .Values.csiNode.prepareOvirtConfig.image.repository }}:{{ .Values.csiNode.prepareOvirtConfig.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: Always
        command: ["/bin/sh", "-ec"]
        args:
        - >-
          /ovirt-csi-driver --prepare-ovirt-config
          --prepare-ovirt-config-file={{ .Values.csiNode.ovirtNode.env.ovirtConfig }}
          --prepare-ovirt-config-ca-file={{ .Values.csiNode.prepareOvirtConfig.env.ovirtCafile }}
          --prepare-ovirt-config-insecure={{ .Values.ovirt.insecure }} >/dev/null 2>&1
        terminationMessagePolicy: File
        env:
        - name: OVIRT_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.ovirt.secretName }}
              key: ovirt_url
        - name: OVIRT_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ .Values.ovirt.secretName }}
              key: ovirt_username
        - name: OVIRT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.ovirt.secretName }}
              key: ovirt_password
        {{- if .Values.ovirt.caProvided }}
        - name: OVIRT_CAFILE
          value: {{ quote .Values.csiNode.prepareOvirtConfig.env.ovirtCafile }}
        - name: OVIRT_CA_BUNDLE
          valueFrom:
            configMapKeyRef:
              name: {{ .Values.ovirt.caConfigMapName }}
              key: ca.crt
        {{- end }}
        volumeMounts:
        - name: node-config
          mountPath: /tmp/config
      - name: validate-node-ovirt-config
        image: {{ .Values.csiNode.ovirtNode.image.repository }}:{{ .Values.csiNode.ovirtNode.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: Always
        command: ["/bin/sh", "-ec"]
        args:
        - |
          echo 'Starting node oVirt connection validation.'
          /ovirt-csi-driver --endpoint=unix:///csi-socket/csi.sock >/dev/null 2>&1 &
          driver_pid=$!
          for _ in $(seq 1 {{ .Values.preflight.ovirtConnectionTimeoutSeconds }}); do
            if [ -S /csi-socket/csi.sock ]; then
              kill -KILL "$driver_pid" 2>/dev/null || true
              echo 'Node oVirt connection validation succeeded.'
              exit 0
            fi
            if ! kill -0 "$driver_pid" 2>/dev/null; then
              echo 'Node oVirt connection validation failed.' >&2
              exit 1
            fi
            sleep 1
          done
          kill -KILL "$driver_pid" 2>/dev/null || true
          echo 'Node oVirt connection validation timed out.' >&2
          exit 1
        terminationMessagePolicy: File
        env:
        - name: OVIRT_CONFIG
          value: {{ quote .Values.csiNode.ovirtNode.env.ovirtConfig }}
        volumeMounts:
        - name: node-config
          mountPath: /tmp/config
        - name: node-socket
          mountPath: /csi-socket
      containers:
      - name: complete
        image: {{ .Values.csiController.ovirtController.image.repository }}:{{ .Values.csiController.ovirtController.image.tag | default .Chart.AppVersion }}
        imagePullPolicy: Always
        command: ["/bin/sh", "-ec"]
        args: ["echo 'All configured CSI images started and oVirt configuration validation succeeded.'"]
      volumes:
      - name: controller-config
        emptyDir:
          medium: Memory
      - name: controller-socket
        emptyDir: {}
      - name: node-config
        emptyDir:
          medium: Memory
      - name: node-socket
        emptyDir: {}
{{- end }}
